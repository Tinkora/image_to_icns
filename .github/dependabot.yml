version: 2
updates:
  # Rust dependencies (workspace)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      rust-patch-minor:
        update-types:
          - "patch"
          - "minor"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2

  # Rust dependencies (Worker is intentionally outside the workspace)
  - package-ecosystem: cargo
    directory: "/crates/image_to_icns_worker"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      worker-patch-minor:
        update-types:
          - "patch"
          - "minor"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-patch-minor:
        update-types:
          - "patch"
          - "minor"
