version: 2
updates:
  # Rust dependencies (workspace)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      rust-patch:
        update-types:
          - "patch"
      rust-minor:
        update-types:
          - "minor"

  # Rust dependencies (Worker is intentionally outside the workspace)
  - package-ecosystem: cargo
    directory: "/crates/image_to_icns_worker"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
