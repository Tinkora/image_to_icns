[workspace]
members = ["crates/image_to_icns_core", "crates/image_to_icns_web", "crates/image_to_icns_mcp"]
exclude = ["crates/image_to_icns_worker"]
default-members = ["crates/image_to_icns_core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Tinkora/image_to_icns"
rust-version = "1.95"

[workspace.dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
icns = { version = "0.4.0", default-features = true }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSObject", "NSURL"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "PDFDocument", "PDFKitPlatform", "PDFPage", "objc2-app-kit"] }
resvg = { version = "0.48.1", default-features = true }
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.23"
thiserror = "2.0"

[profile.release]
lto = "thin"
strip = true
