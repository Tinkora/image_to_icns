[package]
name = "image_to_icns_worker"
version = "0.1.0"
description = "Optional metadata-only Session Worker for image_to_icns"
publish = false
edition = "2024"
license = "MIT"
repository = "https://github.com/Tinkora/image_to_icns"
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.4", features = ["d1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
futures-util = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"
